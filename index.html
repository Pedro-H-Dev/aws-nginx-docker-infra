<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Cloud & DevOps - Pedro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            border-radius: 12px;
            background-color: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { font-size: 1.1rem; color: #cbd5e1; }
        .tech-stack {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .tag {
            background-color: #0284c7;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Servidor Web Online! 🚀</h1>
        <p>Aplicação containerizada com Nginx e hospedada na AWS EC2.</p>
        <div class="tech-stack">
            <span class="tag">HTML5</span>
            <span class="tag">Nginx</span>
            <span class="tag">Docker</span>
            <span class="tag">AWS</span>
        </div>
    </div>
</body>
</html>
